services:
  # 1. HDFS NameNode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    restart: always
    ports:
      - "50070:50070"
      - "8020:8020"
    environment:
      - CLUSTER_NAME=smartcar-cluster
    env_file:
      - ./hadoop.env

  # 2. HDFS DataNode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    restart: always
    ports:
      - "50075:50075"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode

  # 3. YARN ResourceManager
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop2.7.4-java8
    container_name: resourcemanager
    restart: always
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
      - datanode

  # 4. Zookeeper (실시간 데이터 연동)
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"

  # 5. Kafka (실시간 운행 정보 버퍼링)
  kafka:
    image: wurstmeister/kafka:2.12-2.2.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  # 6. Hive DB (메타스토어 PostgreSQL) - 기본 postgres 유저로 자동 init (POSTGRES_USER=hive 지정 시 에러 방지)
  hive-metastore-db:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-db
    restart: always

  # 7. Hive Server2 - PostgreSQL 메타스토어 연동 (HIVE_SITE_CONF_ prefix 사용)
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: always
    ports:
      - "10000:10000"
      - "10002:10002"
    env_file:
      - ./hadoop.env
    environment:
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive"
      HIVE_SITE_CONF_datanucleus_autoCreateSchema: "false"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db

